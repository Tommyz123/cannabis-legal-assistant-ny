<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cannabis Law Assistant | AI Control Center</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        'neon-green': '#39ff14',
                        'neon-blue': '#00f3ff',
                        'tech-dark': '#0a0a0f',
                        'tech-panel': '#13131f',
                    },
                    boxShadow: {
                        'neon-green': '0 0 10px #39ff14, 0 0 20px #39ff14',
                        'neon-blue': '0 0 10px #00f3ff, 0 0 20px #00f3ff',
                    }
                }
            }
        }
    </script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-tech-dark text-gray-300 font-sans overflow-hidden h-screen flex relative">

    <!-- Background Grid Animation -->
    <div class="absolute inset-0 z-0 opacity-20 pointer-events-none grid-bg"></div>

    <!-- Sidebar -->
    <aside class="w-64 glass-panel border-r border-gray-800 z-10 hidden md:flex flex-col transition-all duration-300 transform" id="sidebar">
        <div class="p-6 border-b border-gray-800/50">
            <h1 class="font-orbitron text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-neon-green to-emerald-500 tracking-wider">
                CLA <span class="text-xs font-normal text-gray-400 block mt-1">AI Legal Assistant v2.0</span>
            </h1>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar">
            <div class="text-xs font-orbitron text-gray-500 uppercase tracking-widest mb-2 px-2">System Modules</div>

            <a href="#" class="nav-item active flex items-center p-3 rounded-lg hover:bg-white/5 transition-all group">
                <i class="fas fa-terminal w-6 text-neon-green group-hover:shadow-neon-green transition-shadow"></i>
                <span class="ml-3 group-hover:text-white transition-colors">Console</span>
            </a>

            <a href="#" class="nav-item flex items-center p-3 rounded-lg hover:bg-white/5 transition-all group">
                <i class="fas fa-book w-6 text-gray-400 group-hover:text-neon-blue transition-colors"></i>
                <span class="ml-3 group-hover:text-white transition-colors">Legal Database</span>
            </a>

            <a href="#" class="nav-item flex items-center p-3 rounded-lg hover:bg-white/5 transition-all group">
                <i class="fas fa-chart-network w-6 text-gray-400 group-hover:text-purple-500 transition-colors"></i>
                <span class="ml-3 group-hover:text-white transition-colors">Reports</span>
            </a>

            <a href="#" class="nav-item flex items-center p-3 rounded-lg hover:bg-white/5 transition-all group">
                <i class="fas fa-cog w-6 text-gray-400 group-hover:text-yellow-500 transition-colors"></i>
                <span class="ml-3 group-hover:text-white transition-colors">Settings</span>
            </a>
        </nav>

        <div class="p-4 border-t border-gray-800/50">
            <div class="bg-black/40 rounded-lg p-3 border border-gray-800">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs text-gray-400 font-orbitron">SYSTEM STATUS</span>
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-neon-green opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-neon-green"></span>
                    </span>
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-500">CPU Load</span>
                        <span class="text-neon-green">12%</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-1">
                        <div class="bg-neon-green h-1 rounded-full" style="width: 12%"></div>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative z-10 h-full">
        <!-- Header -->
        <header class="h-16 border-b border-gray-800/50 glass-header flex items-center justify-between px-6">
            <button id="mobile-menu-btn" class="md:hidden text-gray-400 hover:text-white">
                <i class="fas fa-bars text-xl"></i>
            </button>

            <div class="flex items-center space-x-4">
                <div class="hidden md:flex items-center space-x-2 text-sm text-gray-400">
                    <span class="w-2 h-2 bg-neon-green rounded-full shadow-neon-green"></span>
                    <span class="font-orbitron tracking-wide">SECURE CONNECTION ESTABLISHED</span>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <button class="p-2 text-gray-400 hover:text-white transition-colors relative">
                    <i class="fas fa-bell"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                </button>
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-neon-green to-blue-500 p-[1px]">
                    <div class="w-full h-full rounded-full bg-black flex items-center justify-center">
                        <i class="fas fa-user-astronaut text-xs text-white"></i>
                    </div>
                </div>
            </div>
        </header>

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar scroll-smooth">
            <!-- Welcome Message -->
            <div class="flex flex-col items-center justify-center h-full text-center space-y-4 opacity-100 transition-opacity duration-500" id="welcome-screen">
                <div class="w-24 h-24 rounded-full bg-black/50 border border-neon-green/30 flex items-center justify-center shadow-neon-green relative group cursor-pointer">
                    <div class="absolute inset-0 rounded-full border border-neon-green/10 animate-ping"></div>
                    <i class="fas fa-fingerprint text-4xl text-neon-green group-hover:scale-110 transition-transform"></i>
                </div>
                <h2 class="text-3xl font-orbitron font-bold text-white tracking-widest">INITIALIZING...</h2>
                <p class="text-gray-400 max-w-md font-light">
                    Cannabis Law Assistant is ready.<br>
                    Enter your legal query or command below.
                </p>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 w-full max-w-2xl">
                    <button class="quick-action glass-card p-4 rounded-xl text-left hover:border-neon-green/50 hover:bg-white/5 transition-all group">
                        <i class="fas fa-search text-neon-green mb-2 group-hover:scale-110 transition-transform block"></i>
                        <h3 class="font-orbitron text-sm text-white">Search Regulations</h3>
                        <p class="text-xs text-gray-500 mt-1">Look up the latest cannabis laws by state</p>
                    </button>
                    <button class="quick-action glass-card p-4 rounded-xl text-left hover:border-neon-blue/50 hover:bg-white/5 transition-all group">
                        <i class="fas fa-file-contract text-neon-blue mb-2 group-hover:scale-110 transition-transform block"></i>
                        <h3 class="font-orbitron text-sm text-white">Compliance Check</h3>
                        <p class="text-xs text-gray-500 mt-1">Analyze your business process for compliance</p>
                    </button>
                </div>
            </div>

            <!-- Messages will be injected here via JS -->
        </div>

        <!-- Input Area -->
        <div class="p-4 md:p-6 pb-8 bg-gradient-to-t from-tech-dark to-transparent">
            <div class="max-w-4xl mx-auto relative glass-input-container rounded-2xl p-[1px] bg-gradient-to-r from-gray-800 to-gray-700 focus-within:from-neon-green focus-within:to-emerald-500 transition-all duration-300 shadow-lg">
                <div class="bg-black/90 rounded-2xl flex items-end p-2 relative z-10">
                    <button class="p-3 text-gray-400 hover:text-white transition-colors rounded-xl hover:bg-white/5">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <textarea
                        id="user-input"
                        rows="1"
                        class="flex-1 bg-transparent text-white border-0 focus:ring-0 p-3 max-h-32 resize-none font-light placeholder-gray-600 custom-scrollbar"
                        placeholder="Enter command / Ask system..."
                    ></textarea>
                    <button id="send-btn" class="p-3 text-neon-green hover:text-emerald-300 transition-colors rounded-xl hover:bg-neon-green/10 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <!-- Scan effect line -->
                <div class="absolute bottom-0 left-0 w-full h-[1px] bg-neon-green/50 opacity-0 transition-opacity duration-300 input-scan-line"></div>
            </div>
            <p class="text-center text-[10px] text-gray-600 mt-2 font-orbitron uppercase tracking-widest">
                System v2.0.1 | Encrypted End-to-End
            </p>
        </div>
    </main>

    <script src="app_en.js"></script>
</body>
</html>
